[project]
name = "concordat"
version = "0.0.2"
description = "Typed sessions for AI agents: protocols the runtime enforces on the model."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "miladsikaroudi" }]
dependencies = []
keywords = ["agents", "llm", "session types", "typestate", "protocols", "claude", "openai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/miladsikaroudi/concordat"
Repository = "https://github.com/miladsikaroudi/concordat"
Issues = "https://github.com/miladsikaroudi/concordat/issues"
Documentation = "https://github.com/miladsikaroudi/concordat/blob/main/docs/design.md"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.12,<2",
]
openai = [
    "openai>=3.26,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
    "anthropic==1.12.1",
    "openai==3.26.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
