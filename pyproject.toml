[project]
name = "concordat"
version = "0.0.1"
description = "Typed sessions for AI agents: protocols the runtime enforces on the model."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["agents", "llm", "session types", "typestate", "protocols"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/miladsikaroudi/concordat"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.12,<2",
]
openai = [
    "openai>=3.26,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
    "anthropic==1.12.1",
    "openai==3.26.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
