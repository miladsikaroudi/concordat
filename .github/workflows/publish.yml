name: Publish

# Runs when a GitHub release is published. Uses PyPI trusted publishing:
# no API token is stored anywhere; PyPI trusts this workflow directly.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # lets PyPI verify this workflow's identity
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the release tag matches the package version
        run: |
          version=$(uv version --short)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${version}"; exit 1; }
      - run: uv sync
      - run: uv run pytest
      - run: uv build
      - run: uv publish
